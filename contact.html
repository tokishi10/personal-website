<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Toki SHI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── Navigation ── -->
<nav class="nav" id="nav">
  <div class="nav__inner">
    <a href="index.html" class="nav__logo" aria-label="Home">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </a>
    <ul class="nav__links" id="nav-links">
      <li><a href="category.html?cat=landscape" class="nav__link">Landscape</a></li>
      <li><a href="category.html?cat=street" class="nav__link">Street</a></li>
      <li><a href="about.html" class="nav__link">About</a></li>
      <li><a href="contact.html" class="nav__link">Contact</a></li>
    </ul>
    <button class="nav__toggle" id="nav-toggle" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- ── Contact Content ── -->
<main class="page-content">
  <section class="contact-section">
    <div class="container">

      <div class="contact-header">
        <p class="contact-desc">Fill out the form below and I'll get back to you.</p>
      </div>

      <!-- Replace YOUR_FORM_ID with your Formspree form ID after signing up at formspree.io -->
      <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

        <div class="form-row">
          <div class="form-field">
            <label class="form-label" for="name">Name</label>
            <input class="form-input" type="text" id="name" name="name" required autocomplete="off">
          </div>
          <div class="form-field">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" required autocomplete="off">
          </div>
        </div>

        <div class="form-field">
          <label class="form-label" for="subject">Subject</label>
          <input class="form-input" type="text" id="subject" name="subject" required autocomplete="off">
        </div>

        <div class="form-field">
          <label class="form-label" for="message">Message</label>
          <textarea class="form-textarea" id="message" name="message" required></textarea>
        </div>

        <button class="form-submit" type="submit">Send message</button>

      </form>

    </div>
  </section>
</main>

<!-- ── Footer ── -->
<footer class="footer">
  <div class="container">
    <div class="footer__inner">
      <span class="footer__name js-site-name">Toki SHI</span>
      <span class="footer__copy">© <span class="js-year"></span> · All rights reserved</span>
    </div>
  </div>
</footer>

<script src="js/app.js"></script>
</body>
</html>
